<html lang="ko">

<style>
  :root { --bg:#EFEDE8; --ink:#141414; --sub:#77746D; --line:#D6D3CC; --accent:#D8472B; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body { overflow:hidden; }
  a { color:inherit; }
  .cond { font-family:Antonio,"Pretendard Variable",sans-serif; letter-spacing:.02em; text-transform:uppercase; }

  header { position:fixed; z-index:5; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:22px 32px; pointer-events:none; }
  header > * { pointer-events:auto; }
  header img { height:20px; width:auto; display:block; }
  header nav { display:flex; gap:22px; font-size:14px; }
  header nav a { text-decoration:none; color:var(--sub); }
  header nav a:hover, header nav a[aria-current] { color:var(--ink); }

  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #stage canvas.hot { cursor:pointer; }

  .cap { position:fixed; z-index:4; left:0; right:0; bottom:52px; text-align:center; pointer-events:none; transition:opacity .3s; }
  .cap .tag { font-size:30px; line-height:1; margin:0; }
  .cap .name { margin:10px 0 0; font-size:15px; color:var(--sub); }
  .cap a { pointer-events:auto; display:inline-block; margin-top:16px; font-size:14px; text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:2px; }
  .cap a:hover { color:var(--accent); }
  .fade { opacity:0; }
  .count { position:fixed; z-index:4; right:32px; bottom:52px; font-size:14px; color:var(--sub); transition:opacity .3s; }
  .hint { position:fixed; z-index:4; left:32px; bottom:52px; font-size:13px; color:var(--sub); transition:opacity .6s; }
  .bar { position:fixed; z-index:4; left:32px; right:32px; bottom:28px; height:2px; background:var(--line); }
  .bar i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ink); }

  #list { display:none; padding:84px 20px 40px; }
  #list h1 { font-size:13px; font-weight:500; color:var(--sub); margin:0 0 16px; }
  #list ul { list-style:none; margin:0; padding:0; display:grid; gap:28px; }
  #list a { text-decoration:none; display:block; }
  #list img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#ddd; }
  #list .t { margin:10px 0 2px; font-size:20px; }
  #list .k { font-size:14px; color:var(--sub); }
  body.flat { overflow:auto; }
  body.flat header { background:var(--bg); padding:18px 20px; }
  body.flat #list { display:block; }
  body.flat #stage, body.flat .cap, body.flat .count, body.flat .hint, body.flat .bar { display:none; }

<script>

window.WORKS = [
  { href:"../boneul/",    img:"../img/lant_case.jpg?v=4",      tag:"Stone Lantern", name:"나주 서문 석등 무드등" },

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
if (document.body.classList.contains('flat')) throw 0;

const W = window.WORKS;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');

// ── 복도: 폭 HW*2, 높이 H. 작품은 좌우 벽에 번갈아 걸리고, 카메라는 가운데를 따라 -z 방향으로 걷는다
const HW = 3.2, H = 4.2, EYE = 1.6;
const FW = 2.5, FH = FW * 3 / 4;
const GAP = 4.6;                         // 작품 사이 거리
const Z0 = -6;                           // 첫 작품 위치
const zOf = i => Z0 - i * GAP;
const sideOf = i => (i % 2 ? 1 : -1);    // 왼쪽(-1)부터 번갈아
const END = zOf(W.length - 1) - 7;       // 끝 벽
const LEN = 8 - END;                     // 복도 전체 길이

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#EFEDE8');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 10, 34);
const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 80);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 1.3));
const lam = (c, e) => new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: e });

// 벽·바닥·천장
const zc = (8 + END) / 2;
function box(w, h, d, mat, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); scene.add(m); return m; }
const wallM = lam(0xF4F3EF, 0.5);
box(0.1, H, LEN, wallM, -HW - 0.05, H / 2, zc);
box(0.1, H, LEN, wallM, HW + 0.05, H / 2, zc);
box(HW * 2 + 0.2, H, 0.1, lam(0xF4F3EF, 0.55), 0, H / 2, END - 0.05);
box(HW * 2 + 0.2, 0.1, LEN, lam(0xF7F6F3, 0.6), 0, H + 0.05, zc);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HW * 2, LEN), lam(0xDCD8D0, 0.5));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, zc); scene.add(floor);
// 걸레받이 (벽과 바닥 경계를 또렷하게 — 걷는 느낌의 원근선)
const base = lam(0xCFCAC0, 0.3);
box(0.02, 0.09, LEN, base, -HW + 0.01, 0.045, zc);
box(0.02, 0.09, LEN, base,  HW - 0.01, 0.045, zc);
// 천장 조명 줄
for (let z = 6; z > END + 1; z -= 3) box(0.45, 0.02, 2.2, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, H - 0.01, z);
// 바닥 조명 반사 느낌: 은은한 점광
for (let i = 0; i < W.length; i++) { const p = new THREE.PointLight(0xfff6ea, 6, 7, 2); p.position.set(sideOf(i) * (HW - 1.2), H - 0.4, zOf(i)); scene.add(p); }

// 캔버스 글씨
function textTex(lines, w = 1024, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  lines.forEach(L => { g.font = L.font; g.fillStyle = L.color || '#141414'; g.textAlign = L.align || 'left'; g.fillText(L.text, L.x, L.y); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
await Promise.all(['600 70px Antonio', '400 70px Antonio', '500 44px "Pretendard Variable"', '600 44px "Pretendard Variable"'].map(f => document.fonts.load(f, 'RECOV 레코브랩 0123')));
await document.fonts.ready;
const textMat = t => new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false });

// 입구 정면에 걸린 제목 (복도 끝 너머가 아니라 첫 벽 위) → 입구 좌우 벽에 제목
{
  const t = textTex([
    { text: 'RECOV LAB', font: '600 150px Antonio', x: 0, y: 160 },
    { text: 'SELECTED WORK · 2025—2026', font: '400 46px Antonio', x: 4, y: 240, color: '#77746D' },
    { text: '기구설계 엔지니어가 설계부터 시제품까지 직접 만듭니다.', font: '500 40px "Pretendard Variable"', x: 4, y: 330 },
  ], 1100, 380);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.24), textMat(t));
  m.position.set(HW - 0.02, EYE + 0.1, 0.5); m.rotation.y = -Math.PI / 2; scene.add(m);
}
// 끝 벽: 다음 행동
{
  const t = textTex([
    { text: 'NEXT', font: '400 60px Antonio', x: 512, y: 110, color: '#D8472B', align: 'center' },
    { text: '만들고 싶은 것이 있다면', font: '600 72px "Pretendard Variable"', x: 512, y: 230, align: 'center' },
    { text: '진행 방식 보기 →', font: '500 48px "Pretendard Variable"', x: 512, y: 330, color: '#55524C', align: 'center' },
  ], 1024, 400);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.4), textMat(t));
  m.position.set(0, EYE + 0.1, END + 0.02); m.userData.href = '../service/'; scene.add(m);
  var endSign = m;
}

// 작품 걸기
const loader = new THREE.TextureLoader();
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 18, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const frames = [];
W.forEach((w, i) => {
  const s = sideOf(i), z = zOf(i);
  const grp = new THREE.Group();
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(FW * 1.3, FH * 1.4), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  sh.position.set(0.05, -0.08, -0.03); grp.add(sh);
  const mat = new THREE.Mesh(new THREE.BoxGeometry(FW + 0.14, FH + 0.14, 0.05), lam(0xFFFFFF, 0.4)); grp.add(mat);
  const tex = loader.load(w.img, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; });
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  pic.position.z = 0.027; grp.add(pic);
  const lab = textTex([
    { text: String(i + 1).padStart(2, '0'), font: '400 76px Antonio', x: 0, y: 80, color: '#D8472B' },
    { text: w.tag.toUpperCase(), font: '600 76px Antonio', x: 120, y: 80 },
    { text: w.name, font: '500 46px "Pretendard Variable"', x: 0, y: 160, color: '#55524C' },
    ...(w.badge ? [{ text: w.badge, font: '600 40px "Pretendard Variable"', x: 0, y: 230, color: '#D8472B' }] : []),
  ], 1024, 256);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), textMat(lab));
  plate.position.set(-FW / 2 + 0.8, -FH / 2 - 0.4, 0); grp.add(plate);
  // 벽에 붙이기: 왼쪽 벽이면 +x 방향을, 오른쪽 벽이면 -x 방향을 바라본다
  grp.position.set(s * (HW - 0.04), EYE + 0.15, z);
  grp.rotation.y = s < 0 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(grp);
  pic.userData.i = i; mat.userData.i = i;
  frames.push({ grp, z, s });
});

// ── 걷기: 카메라 z, 멈추는 자리 = 작품 앞 STOP 만큼 떨어진 곳. 가까운 작품 쪽으로 고개를 돌린다
const STOP = 3.3;                         // 작품보다 이만큼 앞(+z)에서 멈춤
const stopOf = i => zOf(i) + STOP;
const ZSTART = 5.2, ZEND = END + 3.6;
let zT = ZSTART, zC = reduce ? ZSTART : ZSTART + 3, yawC = 0;
const clampZ = v => Math.min(ZSTART, Math.max(ZEND, v));

function nearest(z) { let best = -1, d = 1e9; W.forEach((_, i) => { const dd = Math.abs(z - stopOf(i)); if (dd < d) { d = dd; best = i; } }); return { i: best, d }; }

// 휠 → 앞으로 걷기, 잠깐 멈추면 가까운 작품 앞에 선다
let snapT = 0;
const snap = () => { clearTimeout(snapT); snapT = setTimeout(() => { const n = nearest(zT); if (n.d < GAP * 0.45) zT = stopOf(n.i); }, 220); };
addEventListener('wheel', e => { e.preventDefault(); zT = clampZ(zT - (e.deltaY + e.deltaX) * 0.012); hideHint(); snap(); }, { passive: false });
// 터치패드·태블릿 끌기
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', e => { if (ty == null) return; const y = e.touches[0].clientY; zT = clampZ(zT - (ty - y) * 0.03); ty = y; hideHint(); snap(); }, { passive: true });
const goto = d => { const n = nearest(zT); const k = Math.max(0, Math.min(W.length - 1, (d > 0 && zT > stopOf(0) + 0.5) ? 0 : n.i + d)); zT = stopOf(k); hideHint(); };
addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { goto(1); e.preventDefault(); }
  if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { goto(-1); e.preventDefault(); }
  if (e.key === 'Enter' && focusIdx >= 0) location.href = W[focusIdx].href;
});
const hint = document.getElementById('hint');
function hideHint() { hint.style.opacity = 0; }

// 클릭: 서 있는 작품이면 상세로, 다른 작품이면 그 앞으로 걸어간다
const cv = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hitList = frames.flatMap(f => f.grp.children.filter(c => c.userData.i !== undefined)).concat([endSign]);
function pick(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(hitList)[0]?.object; }
let hot = -1;
cv.addEventListener('pointermove', e => { const o = pick(e); hot = o ? (o.userData.i ?? 99) : -1; cv.classList.toggle('hot', !!o); });
cv.addEventListener('click', e => {
  const o = pick(e); if (!o) return;
  if (o.userData.href) { location.href = o.userData.href; return; }
  const i = o.userData.i; if (i === focusIdx) location.href = W[i].href; else { zT = stopOf(i); hideHint(); }
});

// 캡션 · 진행 막대
const capEl = document.getElementById('cap'), capTag = document.getElementById('capTag'), capName = document.getElementById('capName'), capLink = document.getElementById('capLink'), countEl = document.getElementById('count'), barI = document.getElementById('barI');
let focusIdx = -2;
function updateCap() {
  const n = nearest(zC); const i = n.d < 1.2 ? n.i : -1;
  barI.style.width = ((ZSTART - zC) / (ZSTART - ZEND) * 100).toFixed(1) + '%';
  if (i === focusIdx) return; focusIdx = i;
  if (i < 0) { capEl.classList.add('fade'); countEl.classList.add('fade'); return; }
  capTag.textContent = W[i].tag; capName.textContent = W[i].name; capLink.href = W[i].href;
  countEl.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(W.length).padStart(2, '0');
  capEl.classList.remove('fade'); countEl.classList.remove('fade');
}

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1.3 ? 66 : 58; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// 고개 돌림: 가까운 작품과의 거리에 따라 그쪽으로 최대 YAW 만큼
const YAW = 0.62;
function yawFor(z) {
  let y = 0, wsum = 0;
  frames.forEach((f, i) => { const d = z - stopOf(i); const w = Math.exp(-(d * d) / (2 * 1.3 * 1.3)); y += w * (-f.s) * YAW; wsum += w; });
  const endK = Math.min(1, Math.max(0, (z - (END + 4.5)) / 3));  // 끝 벽 앞에서는 정면을 본다
  return y * endK; // 작품 사이에서는 0(정면)으로 돌아온다
}
const clock = new THREE.Clock(); let tAcc = 0;
let manual = false;
function tick() {
  if (manual) return;
  step(Math.min(clock.getDelta(), 0.05));
  requestAnimationFrame(tick);
}
function step(dt) {
  tAcc += dt;
  zC += (zT - zC) * (reduce ? 1 : 1 - Math.exp(-dt * 4));
  const moving = Math.abs(zT - zC) > 0.02;
  yawC += (yawFor(zC) - yawC) * (reduce ? 1 : 1 - Math.exp(-dt * 5));
  const bob = (!reduce && moving) ? Math.sin(zC * 2.2) * 0.012 : 0;   // 걸을 때 아주 약한 흔들림
  camera.position.set(0, EYE + bob, zC);
  camera.rotation.set(0, yawC, 0, 'YXZ');
  frames.forEach((f, i) => { const s = i === hot ? 1.025 : 1; f.grp.scale.lerp(new THREE.Vector3(s, s, s), 0.15); });
  updateCap();
  renderer.render(scene, camera);
}
// 시험·녹화용: 수동 모드에서 휠과 같은 입력을 넣고 시간을 직접 진행
window.__gallery = { setZ: z => { zC = zT = z; }, stopOf, ZSTART, ZEND, n: W.length,
  manual: () => { manual = true; }, wheel: d => { zT = clampZ(zT - d * 0.012); hideHint(); }, snapNow: () => { const n = nearest(zT); if (n.d < GAP * 0.45) zT = stopOf(n.i); }, step };
tick();
</script>
