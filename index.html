<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RECOV LAB · 레코브랩</title>
<meta name="description" content="기구설계 엔지니어의 작업실. 제품 설계, 시제품 제작, AI 영상 제작 외주 문의를 받습니다.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="RECOV LAB · 레코브랩">
<meta property="og:description" content="기구설계 엔지니어의 작업실 · 옛것을 오늘의 시선으로 되살립니다">
<meta property="og:url" content="https://seungwoo0505.github.io/recov/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #1C1E22;
    --red: #D8472B;
    --gray: #5F5F5A;
    --light: #9A9A94;
    --hair: #E4E1DA;
    --paper: #F6F5F1;
    --white: #FFFFFF;
    --gutter: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--white);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 var(--gutter); }

  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .bar img { height: 22px; width: auto; }
  .bar .ask { font-size: 14px; font-weight: 600; padding: 8px 0; }
  .bar .ask:hover { color: var(--red); }

  /* 첫 화면: 한 문장과 점 하나 */
  .hero { padding: 56px 0 64px; }
  .hero h1 {
    font-size: clamp(34px, 8.6vw, 60px);
    line-height: 1.24;
    font-weight: 700;
    letter-spacing: -0.035em;
  }
  .period {
    display: inline-block;
    width: .2em; height: .2em;
    margin-left: .06em;
    border-radius: 50%;
    background: var(--red);
  }
  .hero h1 .period { animation: land .5s cubic-bezier(.2, 1.6, .4, 1) .35s both; }
  @keyframes land { from { transform: scale(0); } to { transform: scale(1); } }
  .hero p { margin-top: 20px; color: var(--gray); font-size: 17px; }

  section { border-top: 1px solid var(--hair); padding: 24px 0 64px; }
  h2 { font-size: 15px; font-weight: 700; margin-bottom: 24px; }

  /* 만든 것: 그림과 이름만 */
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .work img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--paper); }
  .work h3 { margin-top: 12px; font-size: 16px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; }
  .work p { margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--light); }
  .work:hover h3 { color: var(--red); }

  /* 외주 문의 */
  .contact p { color: var(--gray); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 28px; margin-top: 20px;
    border-radius: 999px;
    background: var(--ink); color: var(--white);
    font-size: 16px; font-weight: 600;
  }
  .btn:hover { background: #000; }
  .contact .mail { margin-top: 12px; font-size: 14px; color: var(--light); }

  /* 바로가기 */
  .links { list-style: none; }
  .links a { display: block; padding: 14px 0; border-bottom: 1px solid var(--hair); font-weight: 600; }
  .links li:first-child a { padding-top: 0; }
  .links a:hover { color: var(--red); }

  footer { padding: 8px 0 calc(40px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--light); }
  footer .period { width: 6px; height: 6px; margin: 0 8px 0 0; vertical-align: middle; }

  @media (min-width: 760px) {
    :root { --gutter: 40px; }
    .bar { height: 80px; }
    .bar img { height: 26px; }
    .hero { padding: 96px 0 104px; }
    .hero p { font-size: 19px; }
    /* 구획 제목은 왼쪽 칸, 내용은 오른쪽 칸 */
    section { display: grid; grid-template-columns: 200px 1fr; padding: 28px 0 96px; }
    h2 { margin: 0; }
    .works { gap: 32px; }
    .work h3 { font-size: 18px; }
    .work p { font-size: 14px; }
    .btn { margin-top: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .hero h1 .period { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a href="./" aria-label="RECOV LAB 처음으로"><img src="logo_h.svg" alt="RECOV LAB"></a>

  <main>

    <section class="contact" id="contact">

        <p class="mail">boneul_official@naver.com</p>
      </div>
    </section>

    <section>
      <h2>바로가기</h2>
      <ul class="links">
        <li><a href="https://smartstore.naver.com/boneulworks">보늘 스토어</a></li>
        <li><a href="https://www.youtube.com/@recov_lab">RECOV LAB 유튜브</a></li>
        <li><a href="https://www.instagram.com/boneul.official">보늘 인스타그램</a></li>
      </ul>
    </section>
  </main>

  <footer><span class="period" aria-hidden="true"></span>RECOV LAB · 레코브랩</footer>
</div>
</body>
</html>
